# Caddy reverse proxy config for the Unstuck network API
# Deploy: copy to /etc/caddy/Caddyfile and run `caddy reload` or `systemctl reload caddy`
#
# Adds:
#   https://172-86-112-140.sslip.io/unstuck/          → SPA frontend
#   https://172-86-112-140.sslip.io/unstuck/api/...   → nserver-persist.js on port 4310

(shared-settings) {
	encode gzip
	header Access-Control-Allow-Origin "*"
	header Access-Control-Allow-Methods "GET, POST, OPTIONS"
	header Access-Control-Allow-Headers "Content-Type"
}

172-86-112-140.sslip.io {
	import shared-settings
	respond /healthz-caddy "ok" 200

	handle_path /newsletter/* {
		root * /var/www/newsletter
		header Cache-Control "no-cache"
		file_server
	}
	handle_path /help/* {
		root * /var/www/help
		header Cache-Control "no-cache"
		file_server
	}

	# Unstuck — SPA frontend
	handle_path /unstuck/* {
		root * /root/unstuck/site
		header Cache-Control "no-cache, must-revalidate"
		try_files {path} /index.html
		file_server
	}

	# Unstuck — API reverse proxy
	handle_path /unstuck/api/* {
		uri strip_prefix /unstuck/api
		reverse_proxy 127.0.0.1:4310
	}

	handle /x-oauth/* {
		reverse_proxy 127.0.0.1:8790
	}
	handle {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Real-IP {remote_host}
		}
	}
}