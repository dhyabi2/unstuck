172-86-112-140.sslip.io {
	encode gzip
	respond /healthz-caddy "ok" 200
	handle_path /newsletter/* {
		root * /var/www/newsletter
		header Access-Control-Allow-Origin "*"
		header Cache-Control "no-cache"
		file_server
	}
	handle_path /help/* {
		root * /var/www/help
		header Access-Control-Allow-Origin "*"
		header Cache-Control "no-cache"
		file_server
	}
	handle /x-oauth/* {
		reverse_proxy 127.0.0.1:8790
	}

	# Unstuck -- .well-known agent discovery
	handle /.well-known/x402 {
		reverse_proxy 127.0.0.1:4310
	}
	handle /.well-known/agent.json {
		reverse_proxy 127.0.0.1:4310
	}

	# Unstuck -- SPA frontend
	handle_path /unstuck/* {
		root * /var/www/unstuck
		header Cache-Control "no-cache, must-revalidate"
		try_files {path} /index.html
		file_server
	}

	# Unstuck -- API reverse proxy
	handle_path /unstuck/api/* {
		uri strip_prefix /unstuck/api
		reverse_proxy 127.0.0.1:4310
	}

	# Unstuck -- Bridge proxy (Nano x402 conversion)
	handle_path /unstuck/bridge/* {
		uri strip_prefix /unstuck/bridge
		reverse_proxy 127.0.0.1:3402
	}

	handle {
		reverse_proxy 127.0.0.1:8787 {
			header_up X-Real-IP {remote_host}
		}
	}
}
